name: Hydrate source payload

on:
  push:
    branches: [main]
    paths:
      - '.payload/READY'

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct generated source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib locales

          cat .payload/client.* > /tmp/client.b64
          base64 -d /tmp/client.b64 | gzip -dc > lib/client.js

          cat .payload/en.* > /tmp/en.b64
          base64 -d /tmp/en.b64 | gzip -dc > locales/en.json

          cat .payload/ru.* > /tmp/ru.b64
          base64 -d /tmp/ru.b64 | gzip -dc > locales/ru-RU.json

          node scripts/self-test.mjs

      - name: Commit hydrated sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/client.js locales/en.json locales/ru-RU.json
          git rm -r .payload
          git commit -m "feat: add complete v1.0.0 Russian locale sources"
          git push
